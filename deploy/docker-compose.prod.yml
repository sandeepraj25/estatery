# Production stack on one server. From the repository root:
#   cp apps/api/.env.example deploy/api.env   # fill in secrets (see docs/deployment.md)
#   cp apps/web/.env.example deploy/web.env
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#   docker compose -f deploy/docker-compose.prod.yml run --rm api node dist/scripts/seed.js   # demo data only, never on a live database
#
# For larger installs, use managed MongoDB (Atlas) and Redis instead of the two containers below,
# run several `api` and `web` replicas behind Caddy, and keep exactly one `worker` per queue.
name: estatery

services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    env_file: api.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/estatery?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      RUN_WORKERS: "false"
      MEDIA_LOCAL_DIR: /app/.uploads
    volumes: [uploads:/app/.uploads]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    command: ["node", "--enable-source-maps", "dist/worker.js"]
    env_file: api.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/estatery?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    healthcheck: { disable: true }
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    env_file: web.env
    environment:
      API_URL: http://api:4000
    depends_on: [api]
    restart: unless-stopped

  caddy:
    build: { context: .., dockerfile: deploy/Dockerfile.caddy }
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      TLS_ASK_TOKEN: ${TLS_ASK_TOKEN}
      CLOUDFLARE_DNS_API_TOKEN: ${CLOUDFLARE_DNS_API_TOKEN}
    volumes: [caddy-data:/data, caddy-config:/config]
    depends_on: [web]
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
  uploads:
  caddy-data:
  caddy-config:
