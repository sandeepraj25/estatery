# Render Blueprint for the API and the background worker (the website runs on Vercel).
# Render → New → Blueprint → pick this repository. Fill the "sync: false" values when asked.
# MongoDB isn't offered by Render: use MongoDB Atlas and paste its connection string as MONGODB_URI.
services:
  - type: web
    name: estatery-api
    runtime: docker
    region: singapore          # closest Render region to India; put Vercel functions in bom1 (Mumbai)
    plan: starter
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_WORKERS
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService: { type: keyvalue, name: estatery-redis, property: connectionString }
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: TLS_ASK_TOKEN
        generateValue: true
      - key: PLATFORM_DOMAIN
        sync: false
      - key: TLS_PROVIDER
        value: vercel
      - key: VERCEL_API_TOKEN
        sync: false
      - key: VERCEL_PROJECT_ID
        sync: false
      - key: VERCEL_TEAM_ID
        sync: false
      - key: DOMAIN_CNAME_TARGET
        value: cname.vercel-dns.com
      - key: DOMAIN_A_RECORDS
        value: 76.76.21.21
      - key: MEDIA_DRIVER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: worker
    name: estatery-worker
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    dockerCommand: node --enable-source-maps dist/worker.js
    envVars:
      # Same settings as the API (Render: Environment Groups make this easier to keep in sync).
      - fromService: { type: web, name: estatery-api, envVarKey: MONGODB_URI }
      - fromService: { type: web, name: estatery-api, envVarKey: INTERNAL_API_KEY }
      - fromService: { type: web, name: estatery-api, envVarKey: JWT_ACCESS_SECRET }
      - fromService: { type: web, name: estatery-api, envVarKey: PLATFORM_DOMAIN }
      - fromService: { type: web, name: estatery-api, envVarKey: SMTP_URL }
      - fromService: { type: web, name: estatery-api, envVarKey: MAIL_FROM }
      - fromService: { type: web, name: estatery-api, envVarKey: RAZORPAY_KEY_ID }
      - fromService: { type: web, name: estatery-api, envVarKey: RAZORPAY_KEY_SECRET }
      - fromService: { type: web, name: estatery-api, envVarKey: RAZORPAY_WEBHOOK_SECRET }
      - fromService: { type: web, name: estatery-api, envVarKey: SENTRY_DSN }
      - key: NODE_ENV
        value: production
      - key: TLS_PROVIDER
        value: vercel
      - key: VERCEL_API_TOKEN
        sync: false
      - key: VERCEL_PROJECT_ID
        sync: false
      - key: MEDIA_DRIVER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: REDIS_URL
        fromService: { type: keyvalue, name: estatery-redis, property: connectionString }

  - type: keyvalue
    name: estatery-redis
    region: singapore
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []            # only Render services in this account can connect
